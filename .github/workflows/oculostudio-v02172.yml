name: OculoStudio v0.21.72 Build

on:
  push:
    branches:
      - oculostudio-v02172-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BASELINE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-e7d4-8211-b58b-1ad94394ce58/raw?se=2026-11-04T18%3A55%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=80b43e8e-a3f2-548a-ae29-44e081409ea5&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T03%3A54%3A04Z&ske=2026-11-05T03%3A54%3A04Z&sks=b&skv=2026-02-06&sig=scvcq1aapXGqf14Sg2fhA3NoMha12Ls0clGNVVuV88s%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect baseline installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/base work/wheel out
          curl -L --fail --retry 3 "$BASELINE_URL" -o work/baseline.zip
          sha256sum work/baseline.zip | tee out/baseline_sha256.txt
          unzip -q work/baseline.zip -d work/base
          echo '=== INSTALLER ROOT ===' | tee out/inventory.txt
          find work/base -maxdepth 3 -type f -printf '%P\n' | sort | tee -a out/inventory.txt
          WHEEL=$(find work/base -type f -name 'oculostudio-*.whl' | head -n1)
          test -n "$WHEEL"
          echo "WHEEL=$WHEEL" | tee -a out/inventory.txt
          unzip -q "$WHEEL" -d work/wheel
          echo '=== PACKAGE FILES ===' | tee -a out/inventory.txt
          find work/wheel -maxdepth 4 -type f -printf '%P\n' | sort | tee -a out/inventory.txt
          echo '=== VERSION ===' | tee -a out/inventory.txt
          grep -RIn --include='*.py' --include='*.js' --include='*.json' '0\.21\.71\|__version__' work/wheel | head -n 80 | tee -a out/inventory.txt || true
          echo '=== DATA MANAGEMENT SYMBOLS ===' | tee -a out/inventory.txt
          grep -RIn --include='*.py' --include='*.js' 'Calibration Data\|Interaction Data\|calibration set\|face_mapper\|facemapper\|session_shared\|interaction_id\|append' work/wheel/oculostudio | head -n 600 | tee -a out/inventory.txt || true
          cp work/wheel/oculostudio/static/app.js out/app.js
          find work/wheel/oculostudio -type f -name '*.py' -maxdepth 4 -print0 | xargs -0 -I{} sh -c 'echo "===== {} ====="; sed -n "1,260p" "{}"' > out/python_sources_head.txt
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: oculostudio-v02171-inspection
          path: out
          if-no-files-found: error
